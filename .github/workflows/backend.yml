name: Backend einrichten

on:
  workflow_dispatch:
  push:
    paths: ["supabase/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Geheimnisse an Supabase übergeben
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            TELEGRAM_SECRET="${{ secrets.TELEGRAM_SECRET }}" \
            ALLOWED_CHAT_IDS="${{ secrets.ALLOWED_CHAT_IDS }}" \
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            APP_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Funktionen hochladen
        run: |
          supabase functions deploy import-recipe --project-ref "$PROJECT_REF" --use-api
          supabase functions deploy telegram-bot  --project-ref "$PROJECT_REF" --use-api --no-verify-jwt

      - name: Telegram mit dem Bot verbinden
        run: |
          curl -sS "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            --data-urlencode "url=https://${PROJECT_REF}.supabase.co/functions/v1/telegram-bot" \
            --data-urlencode "secret_token=${{ secrets.TELEGRAM_SECRET }}" \
            --data-urlencode 'allowed_updates=["message","edited_message"]'
