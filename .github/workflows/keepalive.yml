name: Wachhalten

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anpingen
        run: curl -fsS "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/telegram-bot"
      - uses: actions/checkout@v4
      - name: Lebenszeichen speichern
        run: |
          date -u +"%Y-%m-%dT%H:%MZ" > .keepalive
          git config user.name "chuchi-bot"
          git config user.email "chuchi-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "Wachhalten" || true
          git push || true
